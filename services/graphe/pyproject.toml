[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphe"
version = "0.1.0"
description = "Inari's deterministic graph: phases, lanes, typed envelopes, gates, WAL trace"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
graphe-demo = "graphe.demo:main"

[tool.setuptools]
packages = ["graphe"]

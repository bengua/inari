[package]
name = "kitsune"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kitsune, Inari's voice second brain: notes, their index, their triggers and their audio, in one local SQLite store."

[dependencies]
# SQLite compiled in (FTS5 included): no system library, a static binary stays static.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

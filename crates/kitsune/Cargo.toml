[package]
name = "kitsune"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kitsune, Inari's voice second brain: notes, their index, their triggers and their audio, in one local SQLite store."

[dependencies]
# SQLite compiled in (FTS5 included): no system library, a static binary stays static.
rusqlite = { version = "0.32", features = ["bundled"] }
# Vector search inside the same SQLite file (vec0 tables, KNN by cosine): one C file, static-build clean.
sqlite-vec = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Encryption at rest for audio files: pure Rust (RustCrypto), no C, static-build clean.
aes-gcm = "0.10"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"

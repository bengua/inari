[package]
name = "inari-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Distributed agent core: portable session capsules, provider handover, teleportation."

[lib]
path = "src/lib.rs"

[[bin]]
# Named apart from the Python CLI while both exist; renamed when the port is complete.
name = "inari-core-rs"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.2"
hmac = "0.12"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tar = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

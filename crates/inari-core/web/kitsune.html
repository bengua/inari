<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitsune — Inari</title>
<meta name="inari-page" content="__INARI_PAGE__">
<link rel="preload" href="/assets/fonts/ibm_plex_sans.woff2?v=__INARI_PAGE__" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/app.css?v=__INARI_PAGE__">
<link rel="stylesheet" href="/assets/kitsune.css?v=__INARI_PAGE__">
<script src="/assets/kitsune.js?v=__INARI_PAGE__" defer></script>
</head>
<body class="kit">
<div id="login" class="glass" hidden>
  <h2>Kitsune</h2>
  <label for="tokenInput">Access token or pass</label>
  <small id="loginWhy" class="empty"></small>
  <input id="tokenInput" type="password" autocomplete="current-password">
  <button class="btn go" id="tokenGo">Connect</button>
</div>

<div id="kapp" hidden>
  <header id="kbar">
    <div class="kbrand"><h1>Kitsune</h1><small>your voice notebook, on your own core</small></div>
    <span class="sp"></span>
    <span class="state" id="kAsr" title="Speech to text">ASR</span>
    <span class="state" id="kTts" title="Text to speech">TTS</span>
    <a class="btn small" href="/" title="Back to Inari">Inari</a>
  </header>
  <main id="kmain">
    <section id="kstage" class="glass" aria-label="FoxBot">
      <div id="kfox"></div>
      <p id="ksay" role="status" aria-live="polite"></p>
    </section>
    <aside id="kside">
      <section class="glass kcard" id="kcap">
        <h2>Talk</h2>
        <button class="ktalk" id="kTalk" type="button" aria-describedby="kTime">
          <span class="kdot" aria-hidden="true"></span><span id="kTalkLabel">Hold to talk</span>
        </button>
        <p class="kmeta" id="kTime" aria-live="off"></p>
        <label class="klab" for="kPlace">Place</label>
        <input class="kfield" id="kPlace" type="text" placeholder="kitchen, car, office" autocomplete="off">
        <details class="kmore">
          <summary>Type it instead</summary>
          <textarea class="kfield" id="kText" rows="2" placeholder="What should I remember?"></textarea>
          <button class="btn small" id="kTextGo" type="button">Keep it</button>
        </details>
        <div id="kReview" hidden>
          <label class="klab" for="kReviewText">What did you say?</label>
          <textarea class="kfield" id="kReviewText" rows="3"></textarea>
          <button class="btn small go" id="kReviewSave" type="button">Save the words</button>
        </div>
      </section>
      <section class="glass kcard">
        <h2>Memory</h2>
        <dl class="kgrid">
          <dt>Notes</dt><dd id="kNotes">—</dd>
          <dt>Reminders</dt><dd id="kTriggers">—</dd>
        </dl>
      </section>
      <section class="glass kcard">
        <h2>Local servers</h2>
        <dl class="kgrid">
          <dt>Speech to text</dt><dd id="kAsrUrl">—</dd>
          <dt>Text to speech</dt><dd id="kTtsUrl">—</dd>
          <dt>Embeddings</dt><dd id="kEmbed">—</dd>
        </dl>
      </section>
      <section class="glass kcard">
        <h2>Coming next</h2>
        <ul class="klist">
          <li>Point the core at your own speech and embedding servers.</li>
        </ul>
      </section>
    </aside>
    <section class="glass kcard" id="kmem" aria-label="Memory">
      <h2>Memory</h2>
      <form class="kfind" id="kFind">
        <input class="kfield" id="kQuery" type="search" placeholder="Search what you said" autocomplete="off" aria-label="Search the notes">
        <button class="btn small" id="kFindGo" type="submit">Find</button>
        <button class="btn small" id="kFindClear" type="button" hidden>All</button>
      </form>
      <p class="kmeta" id="kMemState" aria-live="polite"></p>
      <ul class="plist" id="kNotesList"></ul>
      <audio id="kPlayer" hidden></audio>
    </section>
    <section class="glass kcard" id="krem" aria-label="Reminders">
      <h2>Reminders</h2>
      <form class="kfind" id="kRemForm">
        <input class="kfield" id="kRemWhat" type="text" placeholder="What should come back?" autocomplete="off" aria-label="What to be reminded of">
        <input class="kfield kwhen" id="kRemWhen" type="datetime-local" aria-label="When">
        <select class="kfield krep" id="kRemEvery" aria-label="How often">
          <option value="0">once</option>
          <option value="86400">every day</option>
          <option value="604800">every week</option>
        </select>
        <button class="btn small go" id="kRemGo" type="submit">Keep it</button>
      </form>
      <p class="kmeta" id="kRemState" aria-live="polite"></p>
      <ul class="plist" id="kTrigList"></ul>
    </section>
  </main>
</div>
<div id="toast" class="glass" role="status" aria-live="polite"></div>
</body>
</html>

# The same checks one runs by hand before pushing: ./verify.sh (formatting, lints, tests, build).
# The Forge this project is developed on has its own workflow in .forgejo/.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the session sandbox's tests run the agent inside the real bubble
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # TEMP debug: what does bwrap say on this runner?
      - run: |
          sysctl kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
          ls -l /etc/apparmor.d/ 2>/dev/null | grep -i bwrap || echo "no bwrap apparmor profile"
          sudo aa-status 2>&1 | grep -i bwrap || true
          sudo chmod u+s /usr/bin/bwrap && echo "setuid set"
          ls -l /usr/bin/bwrap
          mkdir -p /tmp/bwd
          bwrap --die-with-parent --unshare-user --unshare-ipc --unshare-uts --unshare-cgroup-try --share-net --ro-bind / / --bind /tmp/bwd /tmp/bwd --chdir /tmp/bwd -- echo BUBBLE-OK
          echo "bwrap exit=$?"
      - run: rustup component add clippy rustfmt
      - run: ./verify.sh

  # The Android client: its unit tests and a debug APK, built on the runner's own SDK
  # (platform 35, build-tools 35) with the Gradle wrapper. No secret is needed; the release
  # build and its signing key stay on the owner's machine (android/build.sh release).
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: inari-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Kitsune's live voice (services/kitsune-voice): its tools against a stand-in core.
  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kitsune-voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -m unittest discover -s tests -v

  # The ACP bridge to OpenFox (services/openfox-acp): standard library only,
  # unit tests of the translator and of the WebSocket framing against a
  # stand-in socket server.
  openfox-acp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/openfox-acp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -m unittest discover -s tests -v

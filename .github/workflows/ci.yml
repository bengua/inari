# The same checks one runs by hand before pushing: ./verify.sh (formatting, lints, tests, build).
# The Forge this project is developed on has its own workflow in .forgejo/.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the session sandbox's tests run the agent inside the real bubble; Ubuntu
      # restricts unprivileged user namespaces via AppArmor and ships no bwrap
      # profile, so the runner's bwrap goes setuid (same cure as on the cores)
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo chmod u+s /usr/bin/bwrap
      - run: rustup component add clippy rustfmt
      - run: ./verify.sh

  # The Android client: its unit tests and a debug APK, built on the runner's own SDK
  # (platform 35, build-tools 35) with the Gradle wrapper. No secret is needed; the release
  # build and its signing key stay on the owner's machine (android/build.sh release).
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: inari-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Kitsune's live voice (services/kitsune-voice): its tools against a stand-in core.
  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kitsune-voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -m unittest discover -s tests -v

  # The ACP bridge to OpenFox (services/openfox-acp): standard library only,
  # unit tests of the translator and of the WebSocket framing against a
  # stand-in socket server.
  openfox-acp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/openfox-acp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -m unittest discover -s tests -v

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inari-core"
version = "0.1.0"
description = "Distributed agent core: portable session capsules, hot provider handover, a mesh of nodes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bengua" }]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
# ruff is pinned so CI and local runs agree exactly.
dev = ["ruff==0.16.6", "pytest>=8", "pytest-asyncio>=0.23", "cryptography>=42"]
# Optional OS keychain backend for BYOK secrets (see docs/security.md).
keyring = ["keyring>=25"]
# Ed25519 signatures over exported capsules (see docs/security.md).
signing = ["cryptography>=42"]

[project.scripts]
inari-core = "inari_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inari_core = ["web/*.html", "web/*.css", "web/*.js", "web/fonts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "ISC"]

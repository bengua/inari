}

  --ok:#5fb86b; --warn:#e3b341; --bad:#ec6a5e; --purple:#b48ef0; --glow:rgba(228,138,70,.35); --shadow:0 12px 36px rgba(0,0,0,.45);
  --bg:radial-gradient(900px 520px at 85% -8%, rgba(228,138,70,.16), transparent 60%), radial-gradient(700px 500px at -5% 105%, rgba(180,142,240,.10), transparent 60%), var(--canvas); }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { color-scheme:dark; --canvas:#17161a; --panel:rgba(33,31,36,.72); --panel-solid:#211f24; --raise:rgba(43,40,48,.9); --hair:#3a3640;
  --ink:#f3efe9; --dim:#9e9aa8; --faint:#6f6a78; --copper:#e48a46; --copper-text:#f0a05e; --copper-soft:rgba(228,138,70,.14);
  --ok:#5fb86b; --warn:#e3b341; --bad:#ec6a5e; --purple:#b48ef0; --glow:rgba(228,138,70,.35); --shadow:0 12px 36px rgba(0,0,0,.45);

.btn:hover { border-color:var(--copper); } .btn.go { background:var(--copper); border-color:var(--copper); color:#fff; } :root[data-theme=dark] .btn.go { color:#17161a; }
.btn.small { padding:3px 10px; min-height:30px; font-size:13px; } .btn.on { border-color:var(--copper); color:var(--copper-text); } .btn.icon { width:36px; min-height:36px; padding:0; display:inline-grid; place-items:center; }

#appbar .brand { display:flex; align-items:baseline; gap:8px; min-width:0; } #appbar .brand small { color:var(--faint); font-size:12px; white-space:nowrap; } #appbar .sp { flex:1; }

.dot { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 7px var(--ok); flex:none; } .bar { height:3px; background:var(--hair); } .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--copper),var(--warn)); transition:width .6s; }
.rows { display:grid; gap:1px; padding:4px; } .row { --c:var(--faint); display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; cursor:grab; touch-action:none; user-select:none; min-width:0; position:relative; }

#foot { display:grid; gap:8px; } #bottom { display:flex; align-items:center; gap:6px; } #pill { margin-left:auto; display:flex; gap:6px; align-items:center; padding:4px 8px; border-radius:999px; background:var(--raise); border:1px solid var(--hair); cursor:pointer; }

#brandfoot { color:var(--faint); font-size:12px; padding:0 4px; } .pop { position:fixed; z-index:75; min-width:260px; max-width:360px; padding:12px; display:none; background:var(--panel-solid); } .pop.open { display:block; }

.seg { display:flex; gap:4px; } .seg button { flex:1; } .mrow { display:flex; align-items:center; gap:9px; width:100%; padding:7px 8px; border:0; background:none; border-radius:8px; cursor:pointer; text-align:left; } .mrow:hover,.mrow.on { background:var(--copper-soft); }

/* ---- main ---- */
#main { display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; min-width:0; min-height:0; }
#app.measuring, #app.measuring #side, #app.measuring #bench { transition:none !important; } #app.morphing #main { overflow:hidden; } #app.morphing #main > * { width:var(--freeze); max-width:none; }

#dropdock { position:fixed; z-index:80; display:flex; flex-direction:column; align-items:stretch; gap:6px; max-width:min(92vw,300px); padding:8px; border-radius:16px; background:var(--panel-solid); border:1px solid var(--hair); box-shadow:0 10px 40px rgba(0,0,0,.35); }

.row { touch-action:pan-y; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; } #sleepers { margin-left:auto; margin-right:6px; font-size:12px; text-transform:none; }
#passBanner { grid-row:1; } #top { grid-row:2; } #thread { grid-row:3; } #dock { grid-row:4; }

#passBanner { padding:8px 16px; font-size:13px; background:var(--raise); border-bottom:1px solid var(--hair); color:var(--dim); } #passBanner b { color:var(--ink); } #passBanner button { margin-left:8px; }

#top { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--hair); flex-wrap:wrap; min-height:56px; } #top h2 { margin:0; font-size:16px; flex:1; min-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#back, #benchMobile { display:none; } .phase { font-size:12px; color:var(--c,var(--dim)); display:inline-flex; gap:5px; align-items:center; white-space:nowrap; }

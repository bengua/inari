  --bg:radial-gradient(900px 520px at 85% -8%, rgba(228,138,70,.16), transparent 60%), radial-gradient(700px 500px at -5% 105%, rgba(180,142,240,.10), transparent 60%), var(--canvas); }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { color-scheme:dark; --canvas:#17161a; --panel:rgba(33,31,36,.72); --panel-solid:#211f24; --raise:rgba(43,40,48,.9); --hair:#3a3640;

  --ok:#5fb86b; --warn:#e3b341; --bad:#ec6a5e; --purple:#b48ef0; --glow:rgba(228,138,70,.35); --shadow:0 12px 36px rgba(0,0,0,.45);

.btn.small .i { width:16px; height:16px; } .btn.small { display:inline-flex; align-items:center; gap:6px; }

#sidetop { display:flex; align-items:center; gap:8px; } #sidetop .sp { flex:1; } h1 { margin:0; font-size:15px; letter-spacing:.4px; color:var(--copper-text); }

/* ---- main ---- */

#top { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--hair); flex-wrap:wrap; min-height:56px; } #top h2 { margin:0; font-size:16px; flex:1; min-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#back,#showside { display:none; } #app.noside #showside { display:inline-grid; } .phase { font-size:12px; color:var(--c,var(--dim)); display:inline-flex; gap:5px; align-items:center; white-space:nowrap; }

.msg { max-width:80%; margin:10px 0; padding:11px 15px; border-radius:16px; overflow-wrap:anywhere; line-height:1.55; }
.msg.user { margin-left:auto; background:var(--copper-soft); border:1px solid color-mix(in srgb,var(--copper) 40%,transparent); border-bottom-right-radius:5px; } .msg.assistant { background:var(--raise); border:1px solid var(--hair); border-bottom-left-radius:5px; }

#app.nobench #bench { display:none; } #split { position:absolute; left:-4px; top:0; bottom:0; width:8px; cursor:col-resize; z-index:5; } #split:hover { background:var(--copper-soft); }

.viewer img { max-width:100%; border-radius:10px; display:block; } iframe.preview { width:100%; height:60vh; border:1px solid var(--hair); border-radius:10px; background:#fff; }

#login { max-width:420px; margin:20vh auto; padding:22px; } #login input { width:100%; padding:12px; margin:10px 0; border-radius:10px; border:1px solid var(--hair); background:var(--raise); }
@media (max-width:1100px) { #app, #app.wbmax { grid-template-columns:var(--side) minmax(0,1fr); grid-template-areas:"side main"; } #app.wbmax #main { display:grid; } #bench { position:fixed; inset:0; z-index:55; width:auto; background:var(--panel-solid); display:none; } body.bench-open #bench { display:grid; } #split { display:none; } }
@media (max-width:760px) { body { overflow:auto; } #app, #app.wbmax, #app.noside { grid-template-columns:1fr; grid-template-areas:"side"; height:auto; min-height:100%; } #side { min-height:100vh; border-right:0; } #fox { height:150px; } #app.noside #side { display:grid; }
  #main { position:fixed; inset:0; z-index:50; background:var(--canvas); display:none; } body.open #main { display:grid; } #back { display:inline-grid; } #showside { display:none !important; } .msg,details.tool { max-width:94%; } #pill { margin-left:auto; } }

<body>
<div id="login" class="glass" hidden><h2>Inari</h2><label for="tokenInput">Access token</label><input id="tokenInput" type="password" autocomplete="current-password"><button class="btn go" id="tokenGo">Connect</button></div>
<div id="app" class="nosel" hidden>
  <aside id="side">
    <div id="sidetop"><button class="btn icon" id="hideside" title="Hide the sidebar" aria-label="Hide the sidebar" data-icon="sidebar"></button><h1>Inari</h1><span class="sp"></span><span class="chip" id="stats" aria-live="polite" style="cursor:default">…</span></div>
    <div id="fox" aria-label="Mascot"></div>
    <nav class="nav"><button id="newThread" data-icon="edit"><span>New thread</span></button><button id="searchBtn" data-icon="search"><span>Search threads</span></button><input id="search" type="search" placeholder="Search all journals…" aria-label="Search journals"></nav>
    <div id="hits" class="glass"></div>
    <div id="cores"></div>
    <div id="foot"><div id="approvals"></div><div id="feed" aria-label="Activity"></div>
      <section id="usageCard" hidden aria-label="Provider usage"><header><span data-icon="bars"></span><b>Provider usage</b><button class="btn icon small" id="usageFold" title="Collapse provider usage" aria-label="Collapse provider usage" data-icon="chevron"></button></header><div id="usageBody"></div></section>
      <div id="bottom"><button class="btn icon" id="gear" title="Settings" aria-label="Settings" data-icon="gear"></button><button class="btn icon" id="usageBtn" title="Provider usage" aria-label="Provider usage" aria-expanded="false" data-icon="bars"></button><button id="pill" title="Harness updates" aria-label="Harness updates"></button></div>
      <div id="brandfoot"></div></div>
  </aside>
  <section id="main">
    <div id="top"><button class="btn icon" id="showside" title="Show the sidebar" aria-label="Show the sidebar" data-icon="sidebar"></button><button class="btn small" id="back">‹ Back</button><h2 id="ptitle">Inari</h2><span id="pphase"></span>
      <button class="chip" id="modelChip" hidden></button><button class="btn small" id="actionsBtn" data-icon="more" hidden><span>Actions</span></button><button class="btn small" id="benchBtn" data-icon="panel"><span>Artifacts</span></button></div>
    <div id="thread"><div id="msgs"></div></div>
    <div id="dock"><form class="composer" id="composer"><div class="attached" id="attached"></div><textarea id="msg" rows="2" placeholder="Build anything…" aria-label="Message"></textarea>
      <div class="ctools"><button type="button" class="btn icon" id="attach" title="Attach a file" aria-label="Attach a file" data-icon="plus"></button><input type="file" id="file" multiple hidden>
        <button type="button" class="chip" id="coreChip" title="Where it runs"></button><button type="button" class="chip" id="pickModel" title="Choose the model"></button><span class="sp"></span>
        <button type="button" class="btn icon" id="mic" title="Dictate" aria-label="Dictate" data-icon="mic" hidden></button><button class="send" type="submit" id="sendBtn" aria-label="Send" data-icon="send"></button></div></form>
      <div class="hint">Enter to send · Shift+Enter for a new line</div></div>
  </section>
  <aside id="bench"><div id="split" title="Drag to resize"></div>
    <div class="tabs" role="tablist"><button class="tab on" data-tab="artifacts" role="tab">Artifacts</button><button class="tab" data-tab="terminal" role="tab">Terminal</button><button class="tab" data-tab="viewer" role="tab">Viewer</button><button class="tab" data-tab="journal" role="tab">Journal</button><span class="sp"></span>
      <button class="btn icon" id="wbmax" title="Give the artifacts all the room" aria-label="Expand" data-icon="expand"></button><button class="btn icon" id="benchClose" title="Fold this pane away" aria-label="Fold" data-icon="fold"></button></div>
    <div id="bbody"></div></aside>
</div>
<svg id="tethers" aria-hidden="true"></svg>
<div id="sheet" class="glass" role="dialog" aria-modal="true"><h2 id="sheetTitle"></h2><div class="opts" id="sheetOpts"></div></div>
<div id="pop" class="pop glass"></div><div id="toast" class="glass" role="status" aria-live="assertive"></div>
<script>
"use strict";
const PATHS = {
  sidebar: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>', edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', bars: '<path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', send: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  expand: '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>', fold: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16M8 10l2 2-2 2"/>',
  panel: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/>', chevron: '<path d="m6 9 6 6 6-6"/>', more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/>', image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
  code: '<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>', doc: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  tool: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4Z"/>', terminal: '<path d="m4 17 6-6-6-6M12 19h8"/>',
  move: '<path d="M5 12h14M13 6l6 6-6 6"/>', fork: '<circle cx="6" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="12" cy="19" r="2"/><path d="M6 7v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7M12 12v5"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', spinner: '<path d="M12 3a9 9 0 1 0 9 9"/>',
  merge: '<circle cx="6" cy="19" r="2"/><circle cx="6" cy="5" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 7v10M6 7a7 7 0 0 0 10 5"/>',
};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${PATHS[n] || ""}</svg>`;
document.querySelectorAll("[data-icon]").forEach((e) => e.insertAdjacentHTML("afterbegin", icon(e.dataset.icon)));
const GLYPH = {idle:"·", listening:"◐", inference:"⟳", success:"✓", error:"!"}, LABEL = {idle:"idle", listening:"listening", inference:"working", success:"done", error:"error"};
const STEPS = ["planned","frozen","offered","transferred","verified","ready","committing","committed"];
const $ = (id) => document.getElementById(id), esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem("inari-" + k)) ?? d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem("inari-" + k, JSON.stringify(v)); } catch (e) {} } };
let token = new URLSearchParams(location.hash.slice(1)).get("token") || sessionStorage.getItem("inari-token") || "";
let snap = null, selected = null, tab = "artifacts", events = [], files = null, viewing = null, forkAt = null, drag = null, termHist = [], termPos = 0, pendingModel = "", pendingCore = "", attachments = [];
const loadHist = {}, shut = store.get("shut", {}), feed = [], seen = new Set(); let firstSnap = true, tlStamp = 0, tlBusy = false, lastFiles = "";

/* ---------- families, badges, quotas ---------- */
const FAMILIES = [["claude","claude|anthropic|sonnet|opus|haiku","#d97757","C"],["openai","gpt|codex|^o\\d|openai","#10a37f","O"],["gemini","gemini","#4285f4","G"],["qwen","qwen|q3\\.|q2\\.|heretic|rvn|opus-27b","#6b4fbb","Q"],["gemma","gemma|g4-","#1a73e8","g"],["llama","llama","#0a66c2","L"],["mistral","mistral|codestral|devstral|magistral","#ff7000","M"],["glm","glm|zhipu|umans","#2c5bff","Z"],["kimi","kimi|moonshot","#16a085","K"],["deepseek","deepseek","#4d6bfe","D"],["hammer","hammer|coderfim","#b8612a","H"]];
function family(model) { const m = String(model || "").toLowerCase(); for (const [id, re, c, g] of FAMILIES) if (new RegExp(re).test(m)) return { id, c, g }; return { id: "local", c: "#8a8494", g: "·" }; }
const shortModel = (m) => String(m || "").replace(/^turnstile\//, "").replace(/^[^/]+\//, "") || "default model";
function badge(model, size) {
  const f = family(model), el = document.createElement("span"); el.className = "mb"; if (size) { el.style.width = el.style.height = size + "px"; }
  const hasLogo = snap && (snap.usage || []).some((u) => u.provider_id === f.id && u.logo);
  if (hasLogo) el.innerHTML = `<img alt="" src="/api/logo/${f.id}?token=${encodeURIComponent(token)}">`; else { el.style.background = f.c; el.textContent = f.g; }
  el.title = f.id; return el;
}
function usageFor(model) { const f = family(model).id; return snap && (snap.usage || []).find((u) => u.provider_id === f || (f === "openai" && u.provider_id === "codex")); }
function pctOf(u) { return u && u.windows && u.windows.length ? Math.max(...u.windows.map((w) => w.used_percent)) : null; }
function ring(model) { const p = pctOf(usageFor(model)); if (p == null) return null; const r = document.createElement("span"); r.className = "ring"; r.style.setProperty("--p", p); r.style.setProperty("--rc", p > 85 ? "var(--bad)" : p > 60 ? "var(--warn)" : "var(--copper)"); r.innerHTML = "<i></i>"; r.title = Math.round(p) + "% used"; return r; }
function nodeModels(node) { const n = snap.nodes.find((x) => x.node_id === node); return (n && n.capabilities && n.capabilities.models) || []; }

function api(path, body) { const headers = { "Content-Type": "application/json" }; if (token) headers.Authorization = "Bearer " + token; return fetch(path, { method: body ? "POST" : "GET", headers, body: body ? JSON.stringify(body) : undefined }).then((r) => r.json()); }
function toast(t) { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (e.style.display = "none"), 4200); }
function log(text, tone) { feed.unshift({ t: new Date(), text, tone: tone || "" }); feed.length = Math.min(feed.length, 30); }
function theme(v) { if (v === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v); store.set("theme", v); }
theme(store.get("theme", "auto"));
// Behind a gate that adds the access itself (the phone's way in), the page needs no token:
// it asks once without one and only shows the login when the server says no.
async function connect() {
  if (!token) { const ok = await fetch("/api/search?q=").then((r) => r.ok).catch(() => false); if (!ok) { $("login").hidden = false; return; } }
  else sessionStorage.setItem("inari-token", token);
  history.replaceState(null, "", location.pathname); $("login").hidden = true; $("app").hidden = false; layout();
  const es = new EventSource(token ? "/events?token=" + encodeURIComponent(token) : "/events");
  es.onmessage = (e) => { snap = JSON.parse(e.data); render(); }; es.onerror = () => { $("stats").textContent = "offline"; $("app").style.opacity = ".6"; }; es.onopen = () => ($("app").style.opacity = "1");
}
$("tokenGo").onclick = () => { token = $("tokenInput").value.trim(); connect(); };

/* ---------- layout: sidebar, artifacts pane (fold / expand / resize) ---------- */
function layout() {
  const app = $("app"); app.classList.toggle("noside", !!store.get("noside", false)); app.classList.toggle("nobench", !!store.get("nobench", false)); app.classList.toggle("wbmax", !!store.get("wbmax", false));
  app.style.setProperty("--benchw", store.get("benchw", "42vw")); $("benchBtn").classList.toggle("on", !app.classList.contains("nobench")); requestAnimationFrame(drawTethers);
}
$("hideside").onclick = () => { store.set("noside", true); layout(); }; $("showside").onclick = () => { store.set("noside", false); layout(); };
$("benchClose").onclick = () => { store.set("nobench", true); store.set("wbmax", false); document.body.classList.remove("bench-open"); layout(); };
$("benchBtn").onclick = () => { if (innerWidth <= 1100) document.body.classList.add("bench-open"); else { store.set("nobench", !store.get("nobench", false)); layout(); } };
$("wbmax").onclick = () => { store.set("wbmax", !store.get("wbmax", false)); layout(); };
$("split").onpointerdown = (e) => { e.preventDefault(); const move = (m) => { const w = Math.min(innerWidth - 420, Math.max(360, innerWidth - m.clientX)); $("app").style.setProperty("--benchw", w + "px"); store.set("benchw", w + "px"); }; const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); }; addEventListener("pointermove", move); addEventListener("pointerup", up); };

function absorb() {
  const keys = []; for (const n of snap.notices || []) keys.push(["n" + JSON.stringify(n), n]); for (const r of snap.results || []) keys.push(["r" + r.request, r]); for (const a of snap.approvals || []) keys.push(["a" + a.request_id, a]);
  for (const [k, v] of keys) { if (seen.has(k)) continue; seen.add(k); if (firstSnap) continue;
    if (k[0] === "r") { log(v.ok ? "Teleport committed" : `Teleport ${v.state || "refused"}: ${v.error || ""}`, v.ok ? "ok" : "bad"); if (!v.ok) toast("Teleport " + (v.state || "refused")); }
    else if (k[0] === "a") { log(`Approval requested: ${v.command}`, "ask"); fox("event", "notify"); }
    else if (v.subject === "agent.created") log(v.ok ? `Created ${v.agent} on ${v.node}` : `Create failed: ${v.error}`, v.ok ? "ok" : "bad");
    else if (v.subject === "agent.merged") log(v.ok ? `Merged ${v.source} into ${v.target}` : `Merge failed: ${v.error}`, v.ok ? "ok" : "bad");
    else if (v.stopped) { log(`${v.agent} ${v.stopped === "done" ? "finished" : v.stopped}${v.error ? ": " + v.error : ""}`, v.stopped === "done" ? "ok" : "bad"); if (v.stopped !== "done") fox("event", "notify"); } }
  firstSnap = false;
}
function render() {
  absorb(); $("brandfoot").textContent = (snap.ui && snap.ui.footer) || "";
  for (const n of snap.nodes) { const h = (loadHist[n.node_id] = loadHist[n.node_id] || []); h.push((snap.load[n.node_id] || {}).gpu || 0); if (h.length > 40) h.shift(); }
  const agents = Object.entries(snap.agents), busy = agents.filter(([, a]) => a.phase !== "idle").length;
  $("stats").textContent = `${agents.length} agents · ${busy} working`;
  if (!drag || !drag.active) renderCores(agents);
  renderFeed(); renderApprovals(); renderTop(); renderPill(); renderUsageCard(); mascot(); drawOrbParams(snap.mascot);
  if (selected && Date.now() - tlStamp > 1500) refreshDetail(); else if (!selected) { drawChat(); drawComposer(); if (!$("bbody").firstChild) drawBench(); }
}
const inFlight = (mv) => mv && !["committed", "rolled_back"].includes(mv.state);
function row(id, a, mv) {
  const el = document.createElement("div"); el.className = "row" + (selected === id ? " selected" : "") + (inFlight(mv) ? " moving" : ""); el.dataset.agent = id; el.dataset.phase = a.phase; el.dataset.node = a.node; el.tabIndex = 0;
  el.setAttribute("aria-label", `${a.title || id}, ${LABEL[a.phase]}, on ${a.node}`); el.innerHTML = `<span class="pdot"></span><span class="t"></span>`; el.querySelector(".t").textContent = a.title || id; el.title = (a.last || "") + "\n" + (a.events ?? 0) + " events · " + (a.files ?? 0) + " files";
  if (inFlight(mv)) el.insertAdjacentHTML("beforeend", `<span class="prog">→ ${esc(mv.target)} ${Math.round(Math.max(0, STEPS.indexOf(mv.state)) / 7 * 100)}%</span>`); else el.append(badge(a.model || ""), ...(ring(a.model || "") ? [ring(a.model || "")] : []));
  el.onpointerdown = (e) => startDrag(e, el, id, a.node); el.onkeydown = (e) => { if (e.key === "t" || e.key === "T") openMove(id, a.node); if (e.key === "Enter") select(id); }; return el;
}
function renderCores(agents) {
  const box = $("cores"); box.textContent = "";
  box.insertAdjacentHTML("beforeend", '<div class="sect">Threads by core</div>');
  if (!snap.nodes.length) { box.insertAdjacentHTML("beforeend", '<div class="empty-core">Waiting for a core to announce itself…</div>'); return; }
  for (const n of snap.nodes) {
    const load = (snap.load[n.node_id] || {}).gpu || 0, mine = agents.filter(([, a]) => a.node === n.node_id), c = document.createElement("div");
    c.className = "core" + (shut[n.node_id] ? " shut" : ""); c.dataset.node = n.node_id;
    c.innerHTML = `<div class="chead"><span class="chev">${icon("chevron")}</span><span class="dot"></span><b></b><span class="pct">${Math.round(load * 100)}% · ${mine.length}</span></div><div class="bar"><i style="width:${Math.round(load * 100)}%"></i></div><div class="rows"></div>`;
    c.querySelector("b").textContent = n.node_id; c.querySelector(".chead").onclick = () => { shut[n.node_id] = !shut[n.node_id]; store.set("shut", shut); c.classList.toggle("shut"); requestAnimationFrame(drawTethers); };
    const rows = c.querySelector(".rows"); for (const [id, a] of mine) rows.append(row(id, a, snap.moves[id]));
    for (const mv of Object.values(snap.moves)) if (mv.target === n.node_id && mv.source !== n.node_id && mv.state !== "committed") rows.insertAdjacentHTML("beforeend", `<div class="row moving"><span class="pdot" style="background:var(--copper)"></span><span class="t">⇢ ${esc(mv.agent)}</span><span class="prog">${mv.state === "rolled_back" ? "rolled back" : esc(mv.state)}</span></div>`);
    if (!rows.children.length) rows.innerHTML = '<div class="empty-core">Drop a thread here</div>'; box.append(c);
  }
  requestAnimationFrame(drawTethers);
}
function drawTethers() {
  const svg = $("tethers"); svg.textContent = "";
  for (const mv of Object.values((snap && snap.moves) || {})) { if (!inFlight(mv)) continue;
    const a = document.querySelector(`.core[data-node="${CSS.escape(mv.source)}"]`), b = document.querySelector(`.core[data-node="${CSS.escape(mv.target)}"]`); if (!a || !b) continue;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(), x = ra.right - 6, y1 = ra.top + ra.height / 2, y2 = rb.top + rb.height / 2; svg.insertAdjacentHTML("beforeend", `<path d="M${x},${y1} C${x + 60},${y1} ${x + 60},${y2} ${x},${y2}"/>`); }
}
function renderFeed() { $("feed").innerHTML = feed.length ? feed.slice(0, 6).map((e) => `<div class="${e.tone}"><time>${e.t.toTimeString().slice(0, 5)}</time>${esc(e.text)}</div>`).join("") : '<div class="empty">Moves, approvals and finished turns show here.</div>'; $("feed").style.display = feed.length ? "block" : "none"; }
function renderApprovals() {
  const box = $("approvals"); box.textContent = "";
  for (const r of snap.approvals) { const d = document.createElement("div"); d.className = "ask glass"; d.setAttribute("role", "alert"); d.innerHTML = '<strong>Approve this?</strong><code></code><div class="row2"><button class="btn">Deny</button><button class="btn go">Approve</button></div>';

const KIND = { md: "doc", txt: "doc", py: "code", js: "code", ts: "code", json: "code", html: "code", css: "code", sh: "code", rs: "code", go: "code", png: "image", jpg: "image", jpeg: "image", gif: "image", svg: "image", webp: "image" }, MIME = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp", svg: "image/svg+xml" }, ext = (p) => (p.split(".").pop() || "").toLowerCase();
document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => { tab = t.dataset.tab; drawBench(); })); function setTab(n) { tab = n; drawBench(); }
async function openFile(path) { if (!selected) return; viewing = { path, ...(await api(`/api/agent/${encodeURIComponent(selected)}/file?path=${encodeURIComponent(path)}`)) }; store.set("nobench", false); layout(); document.body.classList.add("bench-open"); setTab("viewer"); }
function renderMarkdown(src) { return String(src).split("```").map((p, i) => i % 2 ? `<pre class="code">${p.replace(/^\w*\n/, "").split("\n").map((l) => `<span class="l">${esc(l)}</span>`).join("")}</pre>` : esc(p).replace(/^### (.*)$/gm, "<h3>$1</h3>").replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>").replace(/^[-*] (.*)$/gm, "• $1").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>")).join(""); }
function viewer(body) {
  if (!viewing) { body.innerHTML = '<p class="empty">Open a file from Artifacts, or from a tool call in the conversation, to see it here.</p>'; return; } const v = viewing, x = ext(v.path);
  body.innerHTML = '<div class="vhead"><h3></h3><button class="btn small" id="vcopy">Copy</button><button class="btn small" id="vdl">Download</button></div><div class="viewer"></div>'; body.querySelector("h3").textContent = `${v.path} · ${v.size} B`; const out = body.querySelector(".viewer");
  if (v.binary && MIME[x] && v.b64) out.innerHTML = `<img alt="${esc(v.path)}" src="data:${MIME[x]};base64,${v.b64}">`; else if (v.binary) out.innerHTML = '<p class="empty">Binary file — download it to open.</p>';
  else if (x === "svg") out.innerHTML = `<img alt="${esc(v.path)}" src="data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(v.text)))}">`; else if (x === "html" || x === "htm") { out.innerHTML = '<iframe class="preview" sandbox="" title="Preview"></iframe>'; out.querySelector("iframe").srcdoc = v.text; }
  else if (x === "md") out.innerHTML = `<div class="doc">${renderMarkdown(v.text)}</div>`; else { let t = v.text; if (x === "json") { try { t = JSON.stringify(JSON.parse(t), null, 2); } catch (e) {} } out.innerHTML = `<pre class="code">${t.split("\n").map((l) => `<span class="l">${esc(l)}</span>`).join("")}</pre>`; }
  $("vcopy").onclick = () => navigator.clipboard && navigator.clipboard.writeText(v.text || "").then(() => toast("Copied")); $("vdl").onclick = () => { const blob = v.b64 ? new Blob([Uint8Array.from(atob(v.b64), (c) => c.charCodeAt(0))]) : new Blob([v.text]), u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = v.path.split("/").pop(); a.click(); URL.revokeObjectURL(u); };
}
function terminalLines() { const out = []; for (let i = 0; i < events.length; i++) { const e = events[i]; if (e.kind !== "tool_call") continue; const r = events[i + 1] && events[i + 1].kind === "tool_result" ? events[i + 1] : null;
  let by = "act", cmd = e.text; const m = e.text.match(/^(?:bash|execute|shell|run)[^:]*:\s*(.*)$/s); if (e.text.startsWith("$ ")) { by = "you"; cmd = e.text.slice(2); } else if (m) { by = "agent"; cmd = m[1]; }
  out.push({ cmd, by, out: r ? r.text : "…", bad: r && /^(denied|\w+Error)/.test(r.text) }); } return out; }
function terminal(body) {
  body.style.padding = "10px"; body.innerHTML = '<div id="term"><div id="termout"></div><form id="termform"><span>$</span><input id="terminput" autocomplete="off" spellcheck="false" placeholder="Run a command in this agent\'s workspace" aria-label="Terminal command"></form></div>';
  const o = $("termout"); o.innerHTML = terminalLines().map((l) => `<div class="cmd ${l.by === "agent" ? "ai" : l.by === "act" ? "act" : ""}">${l.by === "you" ? "$" : l.by === "agent" ? "agent $" : "agent ›"} ${esc(l.cmd)}</div><div class="out${l.bad ? " bad" : ""}">${esc(l.out)}</div>`).join("") || '<div class="out">Commands the agent runs appear here. Type one below to run it yourself — the agent will know what you did.</div>'; o.scrollTop = o.scrollHeight; const inp = $("terminput");
  $("termform").onsubmit = async (e) => { e.preventDefault(); const cmd = inp.value.trim(); if (!cmd) return; termHist.push(cmd); termPos = termHist.length; inp.value = ""; inp.disabled = true; await api("/api/exec", { agent: selected, cmd }); inp.disabled = false; tlStamp = 0; files = null; await refreshDetail(); drawBench(); const again = $("terminput"); if (again) again.focus(); };
  inp.onkeydown = (e) => { if (e.key === "ArrowUp" && termPos > 0) { inp.value = termHist[--termPos]; e.preventDefault(); } else if (e.key === "ArrowDown") inp.value = termHist[++termPos] || ""; };
}
function drawBench(soft) {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === tab)); const body = $("bbody"); if (soft && tab === "terminal" && document.activeElement && document.activeElement.id === "terminput") return;
  const keep = body.scrollTop; body.textContent = ""; body.style.padding = ""; if (!selected) { body.innerHTML = '<p class="empty">Select a thread to see its files, run commands, view results and read its journal.</p>'; return; }
  if (tab === "artifacts") { const hidden = !store.get("showgit", false); const shown = files ? files.filter((f) => !hidden || !f.path.startsWith(".git/")) : files; if (!files) { body.innerHTML = '<p class="empty">Loading…</p>'; return; } if (!shown.length) { body.innerHTML = '<p class="empty">No files yet. Ask the agent to create something — its workspace travels with it when you move it.</p>'; return; } body.insertAdjacentHTML("beforeend", `<label class="empty" style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><input type="checkbox" id="showgit" ${hidden ? "" : "checked"}> show .git (${files.length - files.filter((f) => !f.path.startsWith(".git/")).length} files)</label><div class="files"></div>`); $("showgit").onchange = (e) => { store.set("showgit", e.target.checked); drawBench(); };
    for (const f of shown) { const b = document.createElement("button"); b.innerHTML = `<span class="ic">${icon(KIND[ext(f.path)] || "file")}</span><span></span><small></small>`; b.children[1].textContent = f.path; b.children[2].textContent = f.size + " B"; b.onclick = () => openFile(f.path); body.querySelector(".files").append(b); } }
  else if (tab === "terminal") terminal(body); else if (tab === "viewer") viewer(body);
  else { body.insertAdjacentHTML("beforeend", '<p class="empty">Tap an event to fork the thread from it, then press Fork.</p><ul id="tree"></ul>'); const tree = body.querySelector("#tree"); events.forEach((ev) => { const li = document.createElement("li"); li.className = ev.kind + (ev.id === forkAt ? " pick" : ""); const k = document.createElement("b"); k.textContent = ev.kind.replace("_", " "); li.append(k, " " + ev.text.slice(0, 160)); li.onclick = () => { forkAt = ev.id; tree.querySelectorAll(".pick").forEach((x) => x.classList.remove("pick")); li.classList.add("pick"); }; tree.append(li); }); }
  body.scrollTop = keep;
}

/* ---------- search, sheets, create, drag to teleport ---------- */
let hitTimer = null;
$("search").oninput = () => { clearTimeout(hitTimer); hitTimer = setTimeout(async () => { const q = $("search").value.trim(), box = $("hits"); box.textContent = ""; if (!q) { box.style.display = "none"; return; } const { hits } = await api("/api/search?q=" + encodeURIComponent(q)); box.style.display = "block"; box.style.top = $("search").getBoundingClientRect().bottom + 4 + "px"; if (!hits.length) box.innerHTML = '<small class="empty">No match</small>'; for (const h of hits) { const b = document.createElement("button"); b.innerHTML = "<span></span><small></small>"; b.firstChild.textContent = h.text.slice(0, 90); b.lastChild.textContent = h.agent + " · " + h.kind; b.onclick = () => { box.style.display = "none"; select(h.agent); }; box.append(b); } }, 300); };
function sheet(title, options, note, extra) { $("sheetTitle").textContent = title; const opts = $("sheetOpts"); opts.textContent = ""; if (extra) opts.append(extra); if (note) { const p = document.createElement("small"); p.className = "empty"; p.textContent = note; opts.append(p); } for (const [label, fn] of options) { const b = document.createElement("button"); b.className = "btn"; b.textContent = label; b.onclick = () => { $("sheet").classList.remove("open"); fn(); }; opts.append(b); } const c = document.createElement("button"); c.className = "btn"; c.textContent = "Cancel"; c.onclick = () => $("sheet").classList.remove("open"); opts.append(c); $("sheet").classList.add("open"); (extra || opts.querySelector("button")).focus(); }
function openMove(agent, from) { sheet(`Move ${agent} to…`, snap.nodes.filter((n) => n.node_id !== from && n.role === "heavy").map((n) => [n.node_id, () => teleport(agent, from, n.node_id)])); }
async function teleport(agent, source, target) { const r = await api("/api/teleport", { agent, source, target }); if (r.request) { toast(`Moving ${agent} to ${target}…`); log(`Moving ${agent}: ${source} → ${target}`); } else toast("Request refused"); }
function startDrag(e, el, id, from) { if (e.button > 0) return; drag = { id, from, x: e.clientX, y: e.clientY, active: false, el, ghost: null, hold: null }; drag.hold = setTimeout(() => { if (drag && !drag.active) { openMove(id, from); drag = null; } }, 650); window.onpointermove = onMove; window.onpointerup = onUp; }
function onMove(e) { if (!drag) return; if (!drag.active && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) { clearTimeout(drag.hold); drag.active = true; drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add("ghost", "glass"); document.body.append(drag.ghost); drag.el.style.opacity = ".35"; document.querySelectorAll(".core").forEach((n) => n.classList.add(n.dataset.node === drag.from ? "invalid" : "valid")); } if (drag.active) { drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px"; } }
function onUp(e) { window.onpointermove = window.onpointerup = null; if (!drag) return; clearTimeout(drag.hold); const d = drag; drag = null; document.querySelectorAll(".core").forEach((n) => n.classList.remove("valid", "invalid")); if (!d.active) { select(d.id); return; } d.ghost.remove(); d.el.style.opacity = ""; const t = document.elementsFromPoint(e.clientX, e.clientY).find((x) => x.classList && x.classList.contains("core")); if (t && t.dataset.node !== d.from) teleport(d.id, d.from, t.dataset.node); else if (snap) renderCores(Object.entries(snap.agents)); }
addEventListener("resize", () => snap && drawTethers());
connect();
</script>
</body>

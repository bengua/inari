<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inari</title>
<style>
:root {
  --bg-0:#060913; --bg-1:#0f172a; --fg:#e6edf7; --muted:#8aa0bd; --faint:#5b6f8b;
  --idle:#22d3ee; --listening:#e879f9; --inference:#fbbf24; --success:#34d399; --error:#f87171;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --edge:rgba(255,255,255,.12);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
* { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; color:var(--fg); font:14.5px/1.5 system-ui,sans-serif; overflow:hidden;
  background: radial-gradient(1200px 700px at 70% -10%, #13203d 0, var(--bg-1) 45%, var(--bg-0) 100%) fixed; }
button { font:inherit; color:inherit; }
.glass { background:var(--glass); border:1px solid var(--edge); border-radius:16px;
  backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); }
.btn { background:var(--glass); border:1px solid var(--edge); border-radius:11px; padding:9px 14px; min-height:40px; cursor:pointer; }
.btn:hover { background:var(--glass2); } .btn.go { border-color:var(--success); color:var(--success); }
.btn.small { padding:4px 10px; min-height:30px; font-size:13px; } .btn.on { border-color:var(--idle); color:var(--idle); }
#app { height:100%; display:grid; grid-template-columns: 292px minmax(0,1fr) minmax(380px,42%); gap:14px; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
#app.nobench { grid-template-columns: 292px minmax(0,1fr); } #app.nobench #bench { display:none; }
/* ---- rail: the machines, one column ---- */
#rail { display:grid; grid-template-rows:auto auto auto 1fr auto; gap:10px; min-height:0; }
#brand { display:flex; align-items:center; gap:10px; } #orb { width:54px; height:54px; flex:none; } h1 { margin:0; font-size:19px; letter-spacing:.3px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; } .chip { color:var(--muted); padding:2px 9px; border-radius:999px; background:var(--glass); border:1px solid var(--edge); font-size:12.5px; } .chip b { color:var(--fg); }
#tools { display:grid; gap:8px; position:relative; } #search { padding:9px 12px; border-radius:11px; border:1px solid var(--edge); background:rgba(0,0,0,.3); color:var(--fg); font:inherit; width:100%; }
#hits { position:absolute; top:44px; left:0; right:0; z-index:45; padding:8px; display:none; background:rgba(15,23,42,.97); }
#hits button { display:block; width:100%; text-align:left; background:none; border:0; padding:8px; border-radius:8px; cursor:pointer; } #hits button:hover { background:var(--glass2); } #hits small { color:var(--muted); display:block; }
#graph { overflow:auto; display:grid; gap:12px; align-content:start; padding:2px; min-height:0; }
.machine { padding:11px 12px; display:grid; gap:8px; transition:box-shadow .3s,border-color .3s,opacity .2s; box-shadow:0 0 calc(var(--load,0) * 26px) rgba(34,211,238,calc(.08 + var(--load,0) * .4)); }
.machine.valid { border-color:var(--idle); box-shadow:0 0 28px rgba(34,211,238,.55); } .machine.invalid { opacity:.45; }
.mhead { display:flex; align-items:center; gap:8px; } .mhead b { font-size:15px; } .mhead .pct { margin-left:auto; color:var(--muted); font-size:12px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--success); box-shadow:0 0 7px var(--success); flex:none; }
.role { color:var(--faint); font-size:11.5px; border:1px solid var(--edge); border-radius:999px; padding:0 7px; }
.bar { height:5px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden; } .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--idle),var(--inference)); transition:width .6s; }
.spark { width:100%; height:20px; } .spark polyline { fill:none; stroke:var(--idle); stroke-width:1.5; opacity:.8; }
.cards { display:grid; gap:7px; } .drop { color:var(--faint); border:1.5px dashed var(--edge); border-radius:10px; padding:11px; text-align:center; font-size:12.5px; }
.agent { --c:var(--idle); padding:8px 10px; border-radius:11px; background:rgba(255,255,255,.06); border:1.5px solid var(--c); cursor:grab; touch-action:none; user-select:none; transition:border-color .4s,box-shadow .4s,opacity .3s; position:relative; }
.agent:hover { background:rgba(255,255,255,.1); }
.agent[data-phase=listening] { --c:var(--listening); } .agent[data-phase=inference] { --c:var(--inference); } .agent[data-phase=success] { --c:var(--success); } .agent[data-phase=error] { --c:var(--error); }
.agent.selected { box-shadow:0 0 0 2px rgba(255,255,255,.3), 0 0 16px var(--c); } .agent.moving { border-style:dashed; opacity:.6; cursor:progress; }
.agent .top { display:flex; align-items:center; gap:7px; } .agent .top b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }
.phase { margin-left:auto; font-size:11.5px; color:var(--c, var(--idle)); display:inline-flex; gap:5px; align-items:center; white-space:nowrap; }
.phase.live::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--c, var(--idle)); animation:pulse 1.1s infinite; }
@keyframes pulse { 50% { transform:scale(1.7); opacity:.4; } }
.agent .last { margin:3px 0 0; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge { margin-top:6px; font-size:11.5px; color:var(--inference); } .bar.thin { height:3px; margin-top:3px; } .bar.thin i { background:var(--inference); }
.arriving { border:1.5px dashed var(--idle); border-radius:11px; padding:9px; color:var(--idle); font-size:12.5px; } .arriving.fail { border-color:var(--error); color:var(--error); }
.ghost { position:fixed; pointer-events:none; z-index:80; opacity:.92; width:250px; transform:translate(-50%,-50%) rotate(-1.5deg); }
#tethers { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30; } #tethers path { fill:none; stroke:var(--inference); stroke-width:2; stroke-dasharray:6 7; animation:flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset:-26; } }
#feed { padding:7px 10px; max-height:132px; overflow:auto; font-size:12px; color:var(--muted); } #feed div { padding:1px 0; } #feed time { color:var(--faint); margin-right:6px; } #feed .ok { color:var(--success); } #feed .bad { color:var(--error); } #feed .ask { color:var(--inference); }
.hero { padding:22px 16px; text-align:center; } .hero h2 { margin:0 0 6px; font-size:16px; } .hero p { color:var(--muted); margin:6px 0 14px; font-size:13px; }
/* ---- chat: the main stage ---- */
#chat { display:grid; grid-template-rows:auto 1fr auto; min-height:0; overflow:hidden; }
#chead { padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-bottom:1px solid var(--edge); }
#chead h2 { margin:0; font-size:17px; flex:1; min-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } #back,#benchBtn { display:none; } #benchToggle { display:inline-flex; }
#thread { overflow:auto; padding:18px 8px; min-height:0; scroll-behavior:smooth; } #thread .col { max-width:880px; margin:0 auto; padding:0 14px; }
.welcome { max-width:640px; margin:12vh auto 0; text-align:center; color:var(--muted); } .welcome h2 { color:var(--fg); margin:0 0 6px; } .sugg { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
.msg { max-width:80%; margin:10px 0; padding:11px 15px; border-radius:16px; overflow-wrap:anywhere; line-height:1.55; }
.msg.user { margin-left:auto; background:rgba(232,121,249,.16); border:1px solid rgba(232,121,249,.35); border-bottom-right-radius:5px; }
.msg.assistant { background:var(--glass2); border:1px solid var(--edge); border-bottom-left-radius:5px; }
.msg code { background:rgba(0,0,0,.35); padding:1px 5px; border-radius:5px; font:13px var(--mono); } .msg pre { background:rgba(0,0,0,.4); padding:10px; border-radius:10px; overflow:auto; margin:8px 0; font:13px var(--mono); }
details.tool { margin:6px 0; border:1px solid var(--edge); border-radius:12px; background:rgba(34,211,238,.06); max-width:80%; } details.tool.err { border-color:var(--error); background:rgba(248,113,113,.07); }
details.tool summary { padding:7px 12px; cursor:pointer; color:var(--idle); font-size:13px; } details.tool.err summary { color:var(--error); }
details.tool pre { margin:0; padding:8px 12px; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--muted); font:12.5px var(--mono); max-height:240px; overflow:auto; } details.tool .open { margin:0 12px 8px; }
.note { text-align:center; color:var(--faint); font-size:12px; margin:12px 0; } .typing { display:inline-flex; gap:4px; padding:12px 14px; } .typing i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:pulse 1s infinite; } .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
#composer { padding:12px 16px 14px; border-top:1px solid var(--edge); } #composer[hidden] { display:none; }
#composer .box { max-width:880px; margin:0 auto; display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end; }
#composer textarea { width:100%; min-height:74px; padding:12px 14px; border-radius:14px; border:1px solid var(--edge); background:rgba(0,0,0,.32); color:var(--fg); font:inherit; resize:none; max-height:260px; line-height:1.5; }
#composer textarea:focus { outline:none; border-color:var(--idle); } .hint { max-width:880px; margin:6px auto 0; color:var(--faint); font-size:12px; }
/* ---- workbench: artifacts, terminal, viewer, journal ---- */
#bench { display:grid; grid-template-rows:auto 1fr; min-height:0; overflow:hidden; }
.tabs { display:flex; gap:2px; padding:6px 10px 0; border-bottom:1px solid var(--edge); align-items:center; }
.tab { background:none; border:0; padding:9px 12px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; } .tab.on { color:var(--fg); border-bottom-color:var(--idle); } .tabs .sp { flex:1; }
#bbody { overflow:auto; padding:12px 14px; min-height:0; } .empty { color:var(--muted); }
.files button { display:flex; width:100%; align-items:center; gap:10px; background:none; border:0; border-bottom:1px solid var(--edge); padding:10px 4px; cursor:pointer; text-align:left; } .files button:hover { background:var(--glass); }
.files .ic { width:26px; text-align:center; } .files small { color:var(--faint); margin-left:auto; }
.vhead { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; } .vhead h3 { margin:0; font-size:14px; flex:1; overflow-wrap:anywhere; }
pre.code { margin:0; background:rgba(0,0,0,.4); border-radius:11px; padding:10px 0; overflow:auto; font:13px/1.55 var(--mono); counter-reset:l; } pre.code span.l { display:block; padding:0 12px 0 54px; position:relative; white-space:pre-wrap; overflow-wrap:anywhere; min-height:1.55em; }
pre.code span.l::before { counter-increment:l; content:counter(l); position:absolute; left:0; width:40px; text-align:right; color:var(--faint); }
.doc { background:rgba(0,0,0,.25); border-radius:11px; padding:14px 16px; } .doc h1,.doc h2,.doc h3 { margin:.6em 0 .3em; } .doc code { background:rgba(0,0,0,.35); padding:1px 5px; border-radius:5px; }
.viewer img { max-width:100%; border-radius:10px; display:block; } iframe.preview { width:100%; height:60vh; border:1px solid var(--edge); border-radius:10px; background:#fff; }
#term { display:grid; grid-template-rows:1fr auto; height:100%; min-height:0; gap:8px; } #termout { background:#05070d; border:1px solid var(--edge); border-radius:11px; padding:10px 12px; overflow:auto; font:12.5px/1.5 var(--mono); }
#termout .cmd { color:var(--success); margin-top:8px; } #termout .cmd.ai { color:var(--idle); } #termout .out { color:#c8d3e6; white-space:pre-wrap; overflow-wrap:anywhere; } #termout .out.bad { color:var(--error); }
#termform { display:flex; gap:8px; align-items:center; background:#05070d; border:1px solid var(--edge); border-radius:11px; padding:6px 10px; } #termform span { color:var(--success); font:13px var(--mono); }
#termform input { flex:1; background:none; border:0; color:var(--fg); font:13px var(--mono); outline:none; min-height:30px; }
#tree { list-style:none; margin:0; padding:0; border-left:2px solid var(--edge); } #tree li { position:relative; padding:5px 0 5px 18px; color:var(--muted); cursor:pointer; overflow-wrap:anywhere; }
#tree li::before { content:""; position:absolute; left:-6px; top:12px; width:10px; height:10px; border-radius:50%; background:var(--bg-1); border:2px solid var(--muted); }
#tree li.decision::before { border-color:var(--inference); } #tree li.tool_call::before { border-color:var(--idle); } #tree li.user_message::before { border-color:var(--listening); } #tree li.checkpoint::before { border-radius:2px; transform:rotate(45deg); }
#tree li.pick { color:var(--fg); outline:1px dashed var(--inference); outline-offset:2px; } #tree li b { color:var(--fg); font-weight:600; }
#approvals { display:grid; gap:8px; }
.ask { padding:12px; border-color:var(--inference); background:rgba(15,23,42,.94); }
.ask code { display:block; margin:6px 0 10px; color:var(--inference); overflow-wrap:anywhere; } .ask .row { display:flex; gap:10px; } .ask .row .btn { flex:1; }
#sheet { position:fixed; inset:auto 14px calc(16px + env(safe-area-inset-bottom)) 14px; z-index:70; padding:16px; display:none; max-width:540px; margin:0 auto; background:rgba(15,23,42,.96); }
#sheet.open { display:block; } #sheet h2 { margin:0 0 10px; font-size:15px; } #sheet .opts { display:grid; gap:8px; } #sheet input { width:100%; padding:10px; border-radius:10px; border:1px solid var(--edge); background:rgba(0,0,0,.3); color:var(--fg); font:inherit; }
#toast { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:90; padding:10px 16px; display:none; background:rgba(15,23,42,.96); }
#login { max-width:420px; margin:20vh auto; padding:22px; } #login input { width:100%; padding:12px; margin:10px 0; border-radius:10px; border:1px solid var(--edge); background:rgba(0,0,0,.3); color:var(--fg); font:inherit; }
@media (max-width: 1100px) { #app { grid-template-columns: 260px minmax(0,1fr); } #bench { position:fixed; inset:0; z-index:55; border-radius:0; background:rgba(6,9,19,.98); display:none; } body.bench-open #bench { display:grid; } #benchBtn { display:inline-flex; } #benchToggle { display:none; } }
@media (max-width: 760px) {
  body { overflow:auto; } #app { height:auto; min-height:100%; grid-template-columns:1fr; } #rail { grid-template-rows:auto; } #graph { overflow:visible; } #feed { max-height:90px; }
  #chat { position:fixed; inset:0; z-index:50; border-radius:0; background:rgba(6,9,19,.98); display:none; } body.open #chat { display:grid; } #back { display:inline-flex; }
  .msg,details.tool { max-width:94%; } #approvals { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:14px; right:14px; z-index:60; } #orb { width:64px; height:64px; }
}
@media (prefers-reduced-motion: reduce) { .machine,.agent { transition:none; } .phase.live::before,#tethers path,.typing i { animation:none; } #thread { scroll-behavior:auto; } }
</style>
</head>
<body>
<div id="login" class="glass" hidden><h2>Inari</h2><label for="tokenInput">Access token</label>
  <input id="tokenInput" type="password" autocomplete="current-password"><button class="btn go" id="tokenGo">Connect</button></div>
<div id="app" hidden>
  <aside id="rail">
    <div id="brand"><canvas id="orb" width="216" height="216" role="img" aria-label="Network activity indicator"></canvas><div><h1>Inari</h1><div class="chips" id="stats" aria-live="polite"><span class="chip">connecting…</span></div></div></div>
    <div id="tools"><input id="search" type="search" placeholder="Search all journals…" aria-label="Search journals"><button class="btn" id="newAgent">＋ New agent</button><div id="hits" class="glass"></div></div>
    <div id="approvals"></div>
    <section id="graph" aria-label="Machines and agents"></section>
    <section id="feed" class="glass" aria-label="Activity"></section>
  </aside>
  <section id="chat" class="glass">
    <div id="chead"><button class="btn small" id="back">‹ Back</button><h2 id="ptitle">No agent selected</h2><span id="pphase"></span>
      <button class="btn small" id="moveBtn" hidden>Move…</button><button class="btn small" id="forkBtn" hidden>Fork</button><button class="btn small" id="mergeBtn" hidden>Merge…</button>
      <button class="btn small" id="benchBtn" hidden>Workbench</button><button class="btn small on" id="benchToggle" title="Show or hide the workbench">Workbench</button></div>
    <div id="thread"><div class="col" id="msgs"></div></div>
    <form id="composer" hidden><div class="box"><textarea id="msg" rows="3" placeholder="Ask the agent to do something…" aria-label="Message"></textarea><button class="btn go" type="submit">Send</button></div><div class="hint">Enter to send · Shift+Enter for a new line</div></form>
  </section>
  <aside id="bench" class="glass">
    <div class="tabs" role="tablist"><button class="tab on" data-tab="artifacts" role="tab">Artifacts</button><button class="tab" data-tab="terminal" role="tab">Terminal</button><button class="tab" data-tab="viewer" role="tab">Viewer</button><button class="tab" data-tab="journal" role="tab">Journal</button><span class="sp"></span><button class="btn small" id="benchClose">✕</button></div>
    <div id="bbody"></div>
  </aside>
</div>
<svg id="tethers" aria-hidden="true"></svg>
<div id="sheet" class="glass" role="dialog" aria-modal="true"><h2 id="sheetTitle"></h2><div class="opts" id="sheetOpts"></div></div>
<div id="toast" class="glass" role="status" aria-live="assertive"></div>
<script>
"use strict";
const GLYPH = {idle:"·", listening:"◐", inference:"⟳", success:"✓", error:"!"};
const LABEL = {idle:"idle", listening:"listening", inference:"thinking", success:"done", error:"error"};
const STEPS = ["planned","frozen","offered","transferred","verified","ready","committing","committed"];
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let token = new URLSearchParams(location.hash.slice(1)).get("token") || sessionStorage.getItem("inari-token") || "";
let snap = null, selected = null, tab = "artifacts", events = [], files = null, viewing = null, forkAt = null, drag = null, termLines = [], termHist = [], termPos = 0;
const loadHist = {}, feed = [], seen = new Set(); let firstSnap = true, tlStamp = 0, tlBusy = false, lastFiles = "";

function api(path, body) {
  return fetch(path, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined }).then((r) => r.json());
}
function toast(text) { const t = $("toast"); t.textContent = text; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 4200); }
function log(text, tone) { feed.unshift({ t: new Date(), text, tone: tone || "" }); feed.length = Math.min(feed.length, 30); }
function connect() {
  if (!token) { $("login").hidden = false; return; }
  sessionStorage.setItem("inari-token", token); history.replaceState(null, "", location.pathname);
  $("login").hidden = true; $("app").hidden = false;
  const es = new EventSource("/events?token=" + encodeURIComponent(token));
  es.onmessage = (e) => { snap = JSON.parse(e.data); render(); };
  es.onerror = () => { $("stats").innerHTML = '<span class="chip">offline — last known state</span>'; $("app").style.opacity = ".6"; };
  es.onopen = () => ($("app").style.opacity = "1");
}
$("tokenGo").onclick = () => { token = $("tokenInput").value.trim(); connect(); };

function absorb() {
  const keys = [];
  for (const n of snap.notices || []) keys.push(["n" + JSON.stringify(n), n]);
  for (const r of snap.results || []) keys.push(["r" + r.request, r]);
  for (const a of snap.approvals || []) keys.push(["a" + a.request_id, a]);
  for (const [k, v] of keys) {
    if (seen.has(k)) continue; seen.add(k); if (firstSnap) continue;
    if (k[0] === "r") { log(v.ok ? "Teleport committed" : `Teleport ${v.state || "refused"}: ${v.error || ""}`, v.ok ? "ok" : "bad"); if (!v.ok) toast("Teleport " + (v.state || "refused")); }
    else if (k[0] === "a") log(`Approval requested: ${v.command}`, "ask");
    else if (v.subject === "agent.created") log(v.ok ? `Created ${v.agent} on ${v.node}` : `Create failed: ${v.error}`, v.ok ? "ok" : "bad");
    else if (v.subject === "agent.merged") log(v.ok ? `Merged ${v.source} into ${v.target}` : `Merge failed: ${v.error}`, v.ok ? "ok" : "bad");
    else if (v.stopped) log(`${v.agent} ${v.stopped === "done" ? "finished" : v.stopped}${v.error ? ": " + v.error : ""}`, v.stopped === "done" ? "ok" : "bad");
  }
  firstSnap = false;
}
function render() {
  absorb();
  for (const n of snap.nodes) { const h = (loadHist[n.node_id] = loadHist[n.node_id] || []); h.push((snap.load[n.node_id] || {}).gpu || 0); if (h.length > 40) h.shift(); }
  const agents = Object.entries(snap.agents), busy = agents.filter(([, a]) => a.phase !== "idle").length;
  $("stats").innerHTML = `<span class="chip"><b>${snap.nodes.length}</b> cores</span><span class="chip"><b>${agents.length}</b> agents</span><span class="chip"><b>${busy}</b> working</span>`;
  if (!drag || !drag.active) renderGraph(agents);
  renderFeed(); renderApprovals(); renderHead(); drawOrbParams(snap.mascot);
  if (selected && Date.now() - tlStamp > 1500) refreshDetail();
}
function sparkline(vals) {
  const w = 120, h = 20, pts = vals.map((v, i) => `${(i / Math.max(1, vals.length - 1) * w).toFixed(1)},${(h - 2 - v * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}"/></svg>`;
}
const inFlight = (mv) => mv && !["committed", "rolled_back"].includes(mv.state);
function card(id, a, mv) {
  const el = document.createElement("div"); el.className = "agent" + (selected === id ? " selected" : "") + (inFlight(mv) ? " moving" : "");

  if (still) { ctx.lineWidth = 2 + cur.pulse_hz * 3; ctx.strokeStyle = P.colour; ctx.stroke(); }
